<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpaceLab Spectrum Monitor</title>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --panel: #252540;
    --text: #e0e0e0;
    --muted: #8a8fa3;
    --border: #2a2a4a;
    --accent: #00d9ff;
    --ok: #27ae60;
    --warn: #f39c12;
    --bad: #e94560;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .header {
    display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1.5rem;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border-bottom: 2px solid var(--accent);
  }
  .header img { height: 42px; }
  .header h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: 1px; color: var(--accent); margin: 0; flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 0.4rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.35rem 0.7rem; font-size: 0.8rem; font-variant-numeric: tabular-nums;
  }
  .chip .label { color: var(--muted); text-transform: uppercase; font-size: 0.68rem; letter-spacing: 0.05em; }
  .chip.ok { border-color: var(--ok); }
  .chip.warn { border-color: var(--warn); color: var(--warn); }
  .chip.bad { border-color: var(--bad); color: var(--bad); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--ok); }

  main { padding: 1.25rem 1.5rem; max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }
  .empty, .notice { color: var(--muted); font-size: 0.9rem; }
  .notice {
    background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--warn);
    border-radius: 6px; padding: 0.8rem 1rem;
  }

  .radio { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; }
  .radio-head { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .radio-name { font-size: 1.05rem; font-weight: 700; color: var(--accent); letter-spacing: 0.05em; }
  .radio-what { font-size: 0.9rem; }
  .radio-what .muted { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; }
  canvas { display: block; width: 100%; border-radius: 6px; background: #0a0a14; }
  .zoom { height: 220px; }
  .waterfall { height: 160px; margin-top: 4px; }
  .full { height: 90px; margin-top: 0.75rem; }
  .caption { font-size: 0.72rem; color: var(--muted); margin: 0.35rem 0 0; }
  .legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.72rem; color: var(--muted); margin-top: 0.4rem; }
  .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 0.3rem; }
</style>
</head>
<body>
  <div class="header">
    <img src="https://raw.githubusercontent.com/spacelab-ufsc/grs-doc/main/img/logo-wide.png" alt="SpaceLab UFSC">
    <h1>Spectrum Monitor</h1>
    <span id="sm-chip" class="chip"><span id="sm-dot" class="dot"></span><span class="label">Station Manager</span><span id="sm-text">conectando…</span></span>
    <span id="pass-chip" class="chip"><span class="label">Passagem</span><span id="pass-text">—</span></span>
  </div>

  <main id="radios">
    <p class="empty">Esperando o espectro dos rádios…</p>
  </main>

<script>
// Duas consultas, em ritmos diferentes: o espectro muda a cada quadro do
// bloco FFT (até 5 por segundo); o contexto da passagem, a cada segundo.
const SPECTRUM_MS = 200;
const STATE_MS = 1000;
const cards = {};
let state = null;

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hz = (v) => (v >= 0 ? "+" : "") + Math.round(v) + " Hz";
const mhz = (v) => (v / 1e6).toFixed(6).replace(".", ",") + " MHz";
const ago = (s) => s < 1 ? "agora" : `há ${Math.round(s)} s`;

function colormap(t) {
  t = Math.max(0, Math.min(1, t));
  const stops = [[10, 10, 20], [30, 40, 120], [0, 160, 220], [0, 217, 255], [255, 220, 80], [255, 255, 255]];
  const x = t * (stops.length - 1);
  const i = Math.min(Math.floor(x), stops.length - 2);
  const f = x - i;
  return stops[i].map((a, k) => Math.round(a + (stops[i + 1][k] - a) * f));
}

function fit(canvas) {
  const ratio = window.devicePixelRatio || 1;
  const w = Math.round(canvas.clientWidth * ratio), h = Math.round(canvas.clientHeight * ratio);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; return true; }
  return false;
}

function ensureCard(radio) {
  if (cards[radio]) return cards[radio];
  const host = $("radios");
  if (!Object.keys(cards).length) host.replaceChildren();
  const el = document.createElement("section");
  el.className = "radio";
  el.innerHTML = `
    <div class="radio-head"><span class="radio-name">${esc(radio.toUpperCase())}</span>
      <span class="radio-what"></span></div>
    <div class="chips"></div>
    <canvas class="zoom"></canvas>
    <canvas class="waterfall"></canvas>
    <p class="caption">Em volta da sintonia, em resolução total — a janela onde o ajuste fino procura o satélite.
      Na cascata, o tempo corre para baixo.</p>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>espectro</span>
      <span><i style="background:rgba(39,174,96,.6)"></i>onde o sinal deve ficar (largura do GFSK)</span>
      <span><i style="background:var(--warn)"></i>última rajada medida</span>
    </div>
    <canvas class="full"></canvas>
    <p class="caption">A banda inteira do rádio; a faixa clara é a janela de cima.</p>`;
  const sorted = [...Object.keys(cards), radio].sort();
  const next = sorted[sorted.indexOf(radio) + 1];
  host.insertBefore(el, next ? cards[next].el : null);
  const card = {
    el, seq: -1, scale: null,
    what: el.querySelector(".radio-what"), chips: el.querySelector(".chips"),
    zoom: el.querySelector(".zoom"), waterfall: el.querySelector(".waterfall"),
    full: el.querySelector(".full"), rows: document.createElement("canvas"),
  };
  cards[radio] = card;
  return card;
}

// Escala vertical que acompanha o sinal sem pular a cada quadro.
function scaleFor(card, values) {
  const sorted = [...values].sort((a, b) => a - b);
  const floor = sorted[Math.floor(sorted.length * 0.5)];
  const top = sorted[sorted.length - 1];
  const target = { low: floor - 6, high: Math.max(top + 4, floor + 25) };
  if (!card.scale) card.scale = target;
  card.scale.low += (target.low - card.scale.low) * 0.2;
  card.scale.high += (target.high - card.scale.high) * 0.2;
  return card.scale;
}

function drawLine(canvas, values, scale, color) {
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.beginPath();
  values.forEach((v, i) => {
    const x = (i / (values.length - 1)) * W;
    const y = H - ((v - scale.low) / (scale.high - scale.low)) * H;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1, (window.devicePixelRatio || 1) * 1.2);
  ctx.stroke();
}

function drawZoom(card, s, radioState) {
  fit(card.zoom);
  const canvas = card.zoom, ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height, ratio = window.devicePixelRatio || 1;
  const h = s.header;
  const span = h.zoom_bins * h.zoom_resolution_hz;
  const xOf = (f) => ((f - h.zoom_start_hz) / span) * W;
  ctx.clearRect(0, 0, W, H);

  // Onde o sinal deve ficar: centrado, com a largura de Carson do GFSK.
  const bw = h.expected_bandwidth_hz || 0;
  ctx.fillStyle = "rgba(39,174,96,0.14)";
  ctx.fillRect(xOf(-bw / 2), 0, xOf(bw / 2) - xOf(-bw / 2), H);

  // Grade em kHz.
  ctx.font = `${11 * ratio}px sans-serif`;
  ctx.fillStyle = "#8a8fa3";
  ctx.strokeStyle = "#2a2a4a";
  ctx.lineWidth = 1;
  const step = span > 12000 ? 2000 : 1000;
  for (let f = Math.ceil(h.zoom_start_hz / step) * step; f <= h.zoom_start_hz + span; f += step) {
    const x = xOf(f);
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    ctx.fillText((f / 1000).toFixed(0) + " kHz", x + 3 * ratio, H - 5 * ratio);
  }

  const scale = scaleFor(card, s.zoom);
  drawLine(canvas, s.zoom, scale, "#00d9ff");

  // Centro da sintonia.
  ctx.strokeStyle = "rgba(224,224,224,0.6)";
  ctx.setLineDash([4 * ratio, 4 * ratio]);
  ctx.beginPath(); ctx.moveTo(xOf(0), 0); ctx.lineTo(xOf(0), H); ctx.stroke();

  // Última rajada medida pelo bloco FFT, esmaecendo com a idade.
  const afc = radioState && radioState.afc;
  if (afc) {
    const alpha = Math.max(0.15, 1 - afc.age_s / 30);
    ctx.strokeStyle = `rgba(243,156,18,${alpha})`;
    ctx.lineWidth = 2 * ratio;
    ctx.beginPath(); ctx.moveTo(xOf(afc.offset_hz), 0); ctx.lineTo(xOf(afc.offset_hz), H); ctx.stroke();
  }
  ctx.setLineDash([]);

  ctx.fillStyle = "#e0e0e0";
  const tune = radioState && radioState.tune_hz;
  ctx.fillText(tune ? `centro: ${mhz(tune)}` : "centro: sintonia do receptor (fora de passagem)",
               6 * ratio, 14 * ratio);
  ctx.textAlign = "right";
  ctx.fillText(`${scale.high.toFixed(0)} dB`, W - 6 * ratio, 14 * ratio);
  ctx.textAlign = "left";
}

function pushWaterfall(card, s) {
  const canvas = card.waterfall, rows = card.rows;
  if (fit(canvas)) { rows.width = canvas.width; rows.height = canvas.height; }
  if (rows.width !== canvas.width) { rows.width = canvas.width; rows.height = canvas.height; }
  const W = canvas.width, H = canvas.height, rowH = Math.max(1, Math.round(window.devicePixelRatio || 1));
  const rctx = rows.getContext("2d");
  rctx.drawImage(rows, 0, 0, W, H - rowH, 0, rowH, W, H - rowH);
  const scale = card.scale || { low: -100, high: -40 };
  const row = rctx.createImageData(W, rowH);
  for (let x = 0; x < W; x++) {
    const v = s.zoom[Math.floor((x / W) * s.zoom.length)];
    const [r, g, b] = colormap((v - scale.low) / (scale.high - scale.low));
    for (let y = 0; y < rowH; y++) {
      const p = (y * W + x) * 4;
      row.data[p] = r; row.data[p + 1] = g; row.data[p + 2] = b; row.data[p + 3] = 255;
    }
  }
  rctx.putImageData(row, 0, 0);
  canvas.getContext("2d").drawImage(rows, 0, 0);
}

function drawFull(card, s) {
  fit(card.full);
  const canvas = card.full, ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height, ratio = window.devicePixelRatio || 1;
  const h = s.header, half = h.sample_rate_hz / 2;
  ctx.clearRect(0, 0, W, H);
  const xOf = (f) => ((f + half) / (2 * half)) * W;
  ctx.fillStyle = "rgba(0,217,255,0.10)";
  ctx.fillRect(xOf(-h.window_hz), 0, xOf(h.window_hz) - xOf(-h.window_hz), H);
  const sorted = [...s.full].sort((a, b) => a - b);
  const scale = { low: sorted[Math.floor(sorted.length / 2)] - 6, high: sorted[sorted.length - 1] + 3 };
  drawLine(canvas, s.full, scale, "rgba(0,217,255,0.8)");
  ctx.font = `${10 * ratio}px sans-serif`;
  ctx.fillStyle = "#8a8fa3";
  ctx.fillText(`−${(half / 1000).toFixed(0)} kHz`, 4 * ratio, H - 4 * ratio);
  ctx.textAlign = "right";
  ctx.fillText(`+${(half / 1000).toFixed(0)} kHz`, W - 4 * ratio, H - 4 * ratio);
  ctx.textAlign = "left";
}

function chip(label, value, cls) {
  return `<span class="chip ${cls || ""}"><span class="label">${esc(label)}</span>${value}</span>`;
}

function renderState() {
  const sm = state.station_manager;
  $("sm-dot").classList.toggle("on", sm.available);
  $("sm-text").textContent = sm.available ? "conectado" : "sem resposta";
  const t = state.tracking;
  $("pass-text").textContent = t
    ? `${t.satellite_name} até ${new Date(t.until).toLocaleTimeString("pt-BR")}`
      + (t.elevation_degrees !== null && t.elevation_degrees !== undefined
         ? ` · el ${t.elevation_degrees.toFixed(1)}°` : "")
    : "nenhuma em andamento";

  for (const [radio, r] of Object.entries(state.radios)) {
    const card = ensureCard(radio);
    const d = r.downlink;
    card.what.innerHTML = d
      ? `${esc(t ? t.satellite_name : "")} · <b>${esc(d.name)}</b> <span class="muted">${mhz(d.frequency_hz)} nominal</span>`
      : `<span class="muted">sem passagem neste rádio — mostrando o que o receptor ouve</span>`;
    const chips = [];
    if (r.spectrum_stale) chips.push(chip("espectro", "parado — bloco FFT ou receptor fora do ar", "bad"));
    if (d) {
      chips.push(chip("sintonia", mhz(r.tune_hz)));
      chips.push(chip("Doppler", hz(d.doppler_hz || 0)));
      chips.push(chip("ajuste fino", `${hz(d.offset_hz || 0)} · ${d.afc_updates || 0} ajustes`,
                      d.afc_updates ? "ok" : ""));
    }
    if (r.afc) {
      const a = r.afc;
      chips.push(chip("última rajada",
        `${hz(a.offset_hz)} do centro · SNR ${a.snr_db.toFixed(0)} dB · ${(a.bandwidth_hz / 1000).toFixed(1)} kHz · ${ago(a.age_s)}`,
        a.age_s > 60 ? "" : (Math.abs(a.offset_hz) > 300 ? "warn" : "ok")));
    } else {
      chips.push(chip("última rajada", "nenhuma medida ainda"));
    }
    card.chips.innerHTML = chips.join("");
  }
}

async function pollState() {
  try {
    state = await (await fetch("/api/state")).json();
    renderState();
  } catch (error) {
    $("sm-text").textContent = "monitor sem conexão";
    $("sm-dot").classList.remove("on");
  }
  setTimeout(pollState, STATE_MS);
}

async function pollSpectrum() {
  try {
    const spectra = await (await fetch("/api/spectrum")).json();
    for (const [radio, s] of Object.entries(spectra)) {
      const card = ensureCard(radio);
      if (s.seq === card.seq || !s.zoom.length) continue;
      card.seq = s.seq;
      const radioState = state && state.radios[radio];
      drawZoom(card, s, radioState);
      pushWaterfall(card, s);
      drawFull(card, s);
    }
  } catch (error) { /* o pollState mostra a queda */ }
  setTimeout(pollSpectrum, SPECTRUM_MS);
}

pollState();
pollSpectrum();
</script>
</body>
</html>
